<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的设计作品集</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f2ed;
      color: #292725;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    main { max-width: 1040px; margin: auto; padding: 64px 24px; }
    nav { display: flex; gap: 24px; flex-wrap: wrap; }
    a { color: inherit; text-underline-offset: 5px; }
    header { padding: 90px 0 70px; }
    h1 { font-size: clamp(40px, 8vw, 76px); line-height: 1.2; }
    h2 { margin-top: 64px; }
    .intro { max-width: 600px; color: #68625c; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    article {
      background: #fffdf9;
      border: 1px solid #e4ded6;
      border-radius: 20px;
      padding: 28px;
    }
    article p { color: #68625c; }
    footer { margin-top: 80px; color: #68625c; }
  </style>
</head>
<body>
  <main>
    <nav>
      <a href="#works">作品</a>
      <a href="#about">关于我</a>
      <a href="#contact">联系我</a>
    </nav>

    <header>
      <p>工业设计 / 交互设计</p>
      <h1>你好，我是你的名字。</h1>
      <p class="intro">
        我关注人与产品之间的关系，通过研究、设计与原型，
        探索更清晰、更自然的使用体验。
      </p>
    </header>

    <section id="works">
      <h2>精选作品</h2>
      <div class="grid">
        <article>
          <h3>项目一</h3>
          <p>在这里介绍项目背景、你负责的工作与设计成果。</p>
        </article>
        <article>
          <h3>项目二</h3>
          <p>在这里介绍项目背景、你负责的工作与设计成果。</p>
        </article>
        <article>
          <h3>项目三</h3>
          <p>在这里介绍项目背景、你负责的工作与设计成果。</p>
        </article>
      </div>
    </section>

    <section id="about">
      <h2>关于我</h2>
      <p>在这里填写你的专业、研究兴趣、擅长的工具和求职方向。</p>
    </section>

    <section id="contact">
      <h2>联系我</h2>
      <p><a href="mailto:hello@example.com">发送邮件</a></p>
      <p>微信：填写你愿意公开的微信号</p>
      <p>这里还可以添加小红书、B站、站酷等主页链接。</p>
    </section>

    <footer>© 我的设计作品集</footer>
  </main>
</body>
</html>
